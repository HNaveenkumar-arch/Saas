<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            /* SaaS Theme Colors */
            --primary-violet: #26164A;
            --text-dark: #111827;
            --text-grey: #6B7280;
            --primary-green: #2EE59D;
            --hover-green: #22C583;
            --bg-color: #F9FAFB;
            --card-bg: #FFFFFF;
            --border-color: #E5E7EB;
            --error-color: #EF4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--primary-violet);
            /* Dark Violet Background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            /* Added padding to ensure top/bottom spacing on small screens */
            overflow-x: hidden;
            position: relative;
        }

        /* --- Back to Home Link (Positioned Top Left) --- */
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            text-decoration: none;
            color: var(--card-bg);
            /* White text to contrast with violet background */
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s, transform 0.3s;
            z-index: 10;
        }

        .back-link:hover {
            color: var(--primary-green);
            transform: translateX(-5px);
        }

        /* --- Main Layout Wrapper --- */
        .layout-wrapper {
            display: flex;
            flex-direction: column;
            /* Changed to column for simple centering */
            width: 100%;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            /* Space for the absolute back button on mobile */
        }

        /* ========================================== */
        /* Ultra Premium Loader Styles                */
        /* ========================================== */

        .stackly-loader-wrapper {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #110822;
            /* Deepest Violet for cinematic look */
            transition: opacity 0.7s cubic-bezier(0.87, 0, 0.13, 1),
                visibility 0.7s cubic-bezier(0.87, 0, 0.13, 1);
        }

        .stackly-loader-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateY(0);
            transition: transform 0.7s cubic-bezier(0.87, 0, 0.13, 1);
        }

        /* Ambient Breathing Glow */
        .stackly-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #2EE59D;
            filter: blur(90px);
            opacity: 0.15;
            border-radius: 50%;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        /* Gradient Text Style */
        .stackly-brand {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            position: relative;
            background: linear-gradient(135deg, #FFFFFF 0%, #B1A5CD 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Floating Icon */
        .stackly-brand i {
            color: #2EE59D;
            -webkit-text-fill-color: #2EE59D;
            font-size: 48px;
            animation: floatIcon 2s ease-in-out infinite;
        }

        /* Sleek Progress Track */
        .stackly-progress-track {
            width: 260px;
            height: 2px;
            background: rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }

        /* Glowing Progress Bar */
        .stackly-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: #2EE59D;
            width: 0%;
            box-shadow: 0 0 10px #2EE59D, 0 0 20px rgba(46, 229, 157, 0.6);
            /* 1.8 seconds loading animation */
            animation: ultraLoad 1.8s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        }

        /* The Exit Animation Class */
        .stackly-loader-wrapper.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .load-p {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 30px;

        }

        /* Content sliding slightly up and fading out */
        .stackly-loader-wrapper.hide .stackly-loader-content {
            transform: translateY(-40px) scale(0.98);
        }

        /* --- Keyframe Animations --- */
        @keyframes pulseGlow {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.15;
            }

            50% {
                transform: scale(1.5);
                opacity: 0.25;
            }
        }

        @keyframes floatIcon {

            0%,
            100% {
                transform: translateY(0);
                filter: drop-shadow(0 0 0 rgba(46, 229, 157, 0));
            }

            50% {
                transform: translateY(-6px);
                filter: drop-shadow(0 10px 15px rgba(46, 229, 157, 0.4));
            }
        }

        @keyframes ultraLoad {
            0% {
                width: 0%;
            }

            40% {
                width: 70%;
            }

            100% {
                width: 100%;
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .stackly-brand {
                font-size: 32px;
                letter-spacing: 4px;
            }

            .stackly-brand i {
                font-size: 38px;
            }

            .stackly-progress-track {
                width: 200px;
            }
        }

        /* --- Signup Card --- */
        .signup-page-container {
            display: flex;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            /* For the top accent bar if needed */
        }

        .signup-card {
            padding: 40px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* --- Logo & Header --- */
        .logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .logo i {
            color: var(--primary-green);
        }

        .header-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-text h1 {
            font-size: 26px;
            color: var(--primary-violet);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header-text p {
            font-size: 14px;
            color: var(--text-grey);
        }

        /* --- Role Selection --- */
        .role-container {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .role-card {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #FAFAFA;
        }

        .role-card:hover {
            border-color: var(--primary-green);
            background-color: #F0FDF4;
        }

        .role-card.active {
            border: 2px solid var(--primary-green);
            background-color: #F0FDF4;
        }

        .role-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .role-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0;
            /* Adjusted for smaller cards like in image */
        }

        /* --- Form Styles & Validation --- */
        .signup-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .input-group {
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary-violet);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.3s ease;
            background: #FAFAFA;
        }

        /* Add right padding for inputs with icons (passwords) */
        .password-wrapper input {
            padding-right: 40px;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-green);
            background: #FFF;
        }

        .input-wrapper input.error {
            border-color: var(--error-color);
            background: #FEF2F2;
        }

        /* Error Messages */
        .error-message {
            color: var(--error-color);
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        /* Toggle Password Visibility Icon */
        .toggle-password {
            position: absolute;
            right: 16px;
            color: var(--text-grey);
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary-violet);
        }

        /* --- Submit Button --- */
        .submit-btn {
            background-color: var(--primary-green);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 8px;
            /* Slight extra margin above button */
        }

        .submit-btn:hover {
            background-color: var(--hover-green);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(46, 229, 157, 0.3);
        }

        /* --- Divider --- */
        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .divider span {
            position: relative;
            z-index: 2;
            background-color: var(--card-bg);
            padding: 0 16px;
            color: var(--text-grey);
            font-size: 13px;
        }

        /* --- Social Logins --- */
        .social-logins {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .social-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--primary-violet);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: var(--primary-green);
            color: var(--primary-green);
            transform: translateY(-2px);
        }

        /* --- Footer --- */
        .footer-text {
            text-align: center;
            font-size: 14px;
            color: var(--text-grey);
        }

        .footer-text a {
            color: var(--primary-violet);
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer-text a:hover {
            color: var(--primary-green);
            text-decoration: underline;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 500px) {
            body {
                padding: 70px 15px 30px;
                /* Adjust padding to fit absolute back link */
            }

            .back-link {
                top: 20px;
                left: 20px;
                font-size: 14px;
            }

            .layout-wrapper {
                margin-top: 0;
            }

            .signup-card {
                padding: 30px 20px;
            }

            .role-container {
                /* Keeping side-by-side on mobile as per standard UI, but adding flex wrap if needed */
                flex-direction: row;
                gap: 10px;
            }

            .role-card {
                padding: 12px;
            }

            .role-icon {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="stackly-loader-wrapper" id="premiumLoaderPro">
        <div class="stackly-loader-content">
            <div class="stackly-glow"></div>

            <h1 class="stackly-brand">
                <i class="fa-brands fa-stack-exchange"></i> STACKLY
            </h1>
            <p class="load-p">Saas StartUp</p>

            <div class="stackly-progress-track">
                <div class="stackly-progress-bar"></div>
            </div>
        </div>
    </div>

    <a href="index.html" class="back-link" data-aos="fade-right" data-aos-delay="200">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>

    <div class="layout-wrapper" data-aos="zoom-in" data-aos-duration="800">

        <div class="signup-page-container">
            <div class="signup-card">

                <div class="logo">
                    <i class="fa-brands fa-stack-exchange"></i> STACKLY
                </div>

                <div class="header-text">
                    <h1>Create Account</h1>
                    <p>Join Stackly today!</p>
                </div>

                <div class="role-container">
                    <div class="role-card active" id="role-owner" onclick="selectRole('owner')">
                        <div class="role-icon">🚀</div>
                        <div class="role-title">Startup Owner</div>
                    </div>

                    <div class="role-card" id="role-member" onclick="selectRole('member')">
                        <div class="role-icon">💻</div>
                        <div class="role-title">Team Member</div>
                    </div>
                </div>

                <form id="signupForm" class="signup-form" novalidate>

                    <div class="input-group">
                        <label>Full Name</label>
                        <div class="input-wrapper">
                            <input type="text" id="nameInput" placeholder="Enter your full name" required>
                        </div>
                        <div class="error-message" id="nameError">Full name is required.</div>
                    </div>

                    <div class="input-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <input type="email" id="emailInput" placeholder="Enter email" required>
                        </div>
                        <div class="error-message" id="emailError">Please enter a valid email.</div>
                    </div>

                    <div class="input-group">
                        <label>Password</label>
                        <div class="input-wrapper password-wrapper">
                            <input type="password" id="passwordInput" placeholder="Create password (min 6 chars)"
                                required>
                            <i class="fa-regular fa-eye-slash toggle-password"
                                onclick="togglePassword('passwordInput', this)"></i>
                        </div>
                        <div class="error-message" id="passwordError">Password must be at least 6 characters.</div>
                    </div>

                    <div class="input-group">
                        <label>Confirm Password</label>
                        <div class="input-wrapper password-wrapper">
                            <input type="password" id="confirmPasswordInput" placeholder="Confirm password" required>
                            <i class="fa-regular fa-eye-slash toggle-password"
                                onclick="togglePassword('confirmPasswordInput', this)"></i>
                        </div>
                        <div class="error-message" id="confirmPasswordError">Passwords do not match.</div>
                    </div>

                    <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
                </form>

                <div class="divider">
                    <span>or sign up with</span>
                </div>

                <div class="social-logins">
                    <button class="social-btn"><i class="fa-brands fa-google"></i></button>
                    <button class="social-btn"><i class="fa-brands fa-instagram"></i></button>
                    <button class="social-btn"><i class="fa-brands fa-x-twitter"></i></button>
                </div>

                <div class="footer-text">
                    Already have an account? <a href="login.html">Login here</a>
                </div>

            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
        window.addEventListener("load", () => {
            const loader = document.getElementById("premiumLoaderPro");

            // Exact 2 seconds delay
            setTimeout(() => {
                // Adds the 'hide' class which triggers the sleek CSS exit animation
                loader.classList.add("hide");

                // Wait for transition to finish before removing from DOM
                setTimeout(() => {
                    loader.remove();
                }, 700); // 700ms matches the CSS transition time

            }, 2000);
        });
    </script>

    <script>
        // Initialize Animations
        document.addEventListener('DOMContentLoaded', function () {
            AOS.init({ once: true });
        });

        // Reusable Toggle Password Visibility
        function togglePassword(inputId, iconElement) {
            const pwdInput = document.getElementById(inputId);
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                iconElement.classList.replace('fa-eye-slash', 'fa-eye');
            } else {
                pwdInput.type = 'password';
                iconElement.classList.replace('fa-eye', 'fa-eye-slash');
            }
        }

        // Role Selection Logic
        let currentRole = 'owner';
        function selectRole(role) {
            currentRole = role;
            document.getElementById('role-owner').classList.remove('active');
            document.getElementById('role-member').classList.remove('active');

            if (role === 'owner') {
                document.getElementById('role-owner').classList.add('active');
            } else {
                document.getElementById('role-member').classList.add('active');
            }
        }

        // --- Form Validation Logic ---
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const confirmPasswordInput = document.getElementById('confirmPasswordInput');

        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        // Clear errors on input
        const inputs = [nameInput, emailInput, passwordInput, confirmPasswordInput];
        inputs.forEach(input => {
            input.addEventListener('input', function () {
                this.classList.remove('error');
                // Find the corresponding error message div and hide it
                const errorDiv = document.getElementById(this.id.replace('Input', 'Error'));
                if (errorDiv) errorDiv.style.display = 'none';
            });
        });

        document.getElementById('signupForm').addEventListener('submit', function (e) {
            e.preventDefault(); // Stop default form submission

            let isValid = true;

            const nameVal = nameInput.value.trim();
            const emailVal = emailInput.value.trim();
            const pwdVal = passwordInput.value.trim();
            const confirmPwdVal = confirmPasswordInput.value.trim();

            // 1. Validate Name
            if (nameVal === '') {
                nameInput.classList.add('error');
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }

            // 2. Validate Email
            if (emailVal === '' || !emailPattern.test(emailVal)) {
                emailInput.classList.add('error');
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }

            // 3. Validate Password Length
            if (pwdVal === '' || pwdVal.length < 6) {
                passwordInput.classList.add('error');
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }

            // 4. Validate Password Match
            if (confirmPwdVal === '' || confirmPwdVal !== pwdVal) {
                confirmPasswordInput.classList.add('error');
                document.getElementById('confirmPasswordError').style.display = 'block';
                isValid = false;
            }

            // If all fields are valid
            if (isValid) {
                const btn = document.getElementById('signupBtn');
                const originalText = btn.innerText;
                btn.innerText = 'Creating Account...';

                // Simulate an API call
                setTimeout(() => {
                    window.location.href = 'login.html';
                    btn.innerText = originalText;
                    // Optional: Redirect to login page after successful creation
                    // window.location.href = 'login.html';
                }, 1500);
            }
        });
    </script>
</body>

</html>
